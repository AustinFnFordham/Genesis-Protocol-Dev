<title>Genesis Datapad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: desktop = three-column command center (character | scene | record).
   Phone = one column with a bottom tab bar (Scene / Aero / Gear / Journal). */
:root {
  --bg: #e9eef1;          /* datapad paper */
  --panel: #f6f9fb;
  --panel-2: #dfe7ec;
  --line: #b7c6cf;
  --fg: #14232d;
  --dim: #55697a;
  --accent: #0a6f8f;      /* scanner cyan */
  --accent-fg: #ffffff;
  --amber: #8f5a00;       /* warning / pending */
  --good: #1f7a4d;
  --bad: #a33a2a;
  --f-ui: "Chakra Petch", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, serif;
  --f-data: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070d13; --panel: #0d1721; --panel-2: #132431; --line: #1f3a4d; --fg: #d5e4ec; --dim: #7f98a8;
    --accent: #4fc3e6; --accent-fg: #04202b; --amber: #f0b64a; --good: #54c98c; --bad: #ee7c68; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070d13; --panel: #0d1721; --panel-2: #132431; --line: #1f3a4d; --fg: #d5e4ec; --dim: #7f98a8;
  --accent: #4fc3e6; --accent-fg: #04202b; --amber: #f0b64a; --good: #54c98c; --bad: #ee7c68; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-ui);
  padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; gap: 12px; grid-template-columns: 290px minmax(0, 1fr) 330px; height: calc(100% - 10px); min-height: 0; }
.col { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
.panel > h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.mirror { font: 11px var(--f-data); color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pill { font: 500 10px var(--f-data); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border: 1px solid var(--line); border-radius: 99px; color: var(--dim); white-space: nowrap; }
.pill.fact { color: var(--good); border-color: var(--good); }
.pill.report { color: var(--amber); border-color: var(--amber); }
.pill.belief { color: var(--accent); border-color: var(--accent); }
.pill.pend { color: var(--amber); border-color: var(--amber); }
.pill.ok { color: var(--good); border-color: var(--good); }
.hdr h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .02em; text-wrap: balance; }
.hdr .sub { color: var(--dim); font-size: 13px; display: flex; gap: 8px 14px; flex-wrap: wrap; margin-top: 2px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tags span { font: italic 13px var(--f-read); color: var(--dim); border-bottom: 1px solid var(--line); }
.feed { display: flex; flex-direction: column; gap: 12px; }
.feed .meta { font: 500 10px var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.feed .you .meta { color: var(--accent); }
.feed p { margin: 6px 0 0; font: 17px/1.65 var(--f-read); max-width: 68ch; }
.feed p.say { padding-left: 12px; border-left: 2px solid var(--line); }
.feed .you p { color: var(--accent); }
.empty { color: var(--dim); font: italic 15px var(--f-read); }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; text-align: left; min-height: 44px; flex: 1 1 210px; }
.chip:hover { border-color: var(--accent); }
.note { font-size: 12px; color: var(--dim); }
.composer textarea { width: 100%; min-height: 84px; resize: none; overflow-y: hidden; max-height: 60vh; overflow-anchor: none; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 10px; font: 16px/1.5 var(--f-read); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 500; letter-spacing: .04em; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.act { border: 1px dashed var(--line); border-radius: 3px; padding: 8px 10px; margin-top: 8px; display: grid; gap: 4px; }
.act q { font: 15px var(--f-read); quotes: none; }
.bar { height: 8px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.hp i { background: var(--bad); } .bar.st i { background: var(--amber); }
.stat { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: center; margin: 7px 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.stat b { font: 500 13px var(--f-data); }
.pips { display: flex; gap: 5px; } .pips i { width: 14px; height: 14px; border: 1.5px solid var(--accent); transform: rotate(45deg); } .pips i.on { background: var(--accent); }
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.scores div { text-align: center; border: 1px solid var(--line); border-radius: 3px; padding: 6px 0; }
.scores small { display: block; font: 10px var(--f-data); letter-spacing: .12em; color: var(--dim); }
.scores b { font: 500 18px var(--f-data); } .scores em { font: 12px var(--f-data); color: var(--accent); font-style: normal; margin-left: 4px; }
.portrait { aspect-ratio: 4/3; max-width: 100%; border: 1px solid var(--line); border-radius: 3px; display: grid; place-items: center; background: repeating-linear-gradient(135deg, var(--panel-2) 0 10px, var(--panel) 10px 20px); position: relative; }
.portrait b { font: 600 44px var(--f-ui); letter-spacing: .08em; color: var(--accent); }
.portrait small { position: absolute; bottom: 6px; left: 8px; font: 10px var(--f-data); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.plain li { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
ul.plain li:last-child { border-bottom: 0; }
details summary { cursor: pointer; font-weight: 500; min-height: 28px; }
details p { margin: 4px 0 0; font-size: 13px; color: var(--dim); }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.kv span:last-child { font-family: var(--f-data); }
.tabbar { display: none; }
.jump-new { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; min-height: 44px; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); font: 500 12px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
@media (max-width: 960px) { .jump-new { bottom: calc(128px + env(safe-area-inset-bottom, 0px)); } .app:not([data-tab="scene"]) ~ .jump-new { display: none; } }
.pane { display: contents; }
@media (max-width: 960px) {
  body { padding-block: 8px 0; }
  .app { display: block; height: auto; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .col { overflow: visible; display: none; }
  .app[data-tab="scene"] .col.center, .app[data-tab="aero"] .col.left, .app[data-tab="gear"] .col.gear, .app[data-tab="journal"] .col.right { display: flex; }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
    padding: 0 max(8px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
  .tabbar button { background: none; border: 0; min-height: 56px; font: 500 11px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .tabbar button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
}
@media (min-width: 961px) { .col.gear { display: none; } .only-mobile { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* turn composer */
.budget { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.pill.used { opacity: .55; text-decoration: line-through; }
fieldset.grp { border: 1px solid var(--line); border-radius: 3px; margin: 10px 0 0; padding: 4px 8px 6px; min-width: 0; }
fieldset.grp legend { font: 500 10px var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); padding: 0 4px; }
fieldset[disabled] { opacity: .6; }
.opt { display: flex; gap: 10px; align-items: flex-start; min-height: 40px; padding: 6px 4px; border-radius: 3px; cursor: pointer; }
.opt:hover { background: var(--panel-2); }
.opt input { margin: 3px 0 0; accent-color: var(--accent); width: 18px; height: 18px; flex: 0 0 auto; }
.opt .lbl { min-width: 0; } .opt .lbl small { display: block; color: var(--dim); font-size: 12px; }
table.kvt { width: 100%; border-collapse: collapse; font: 12px var(--f-data); margin-top: 6px; } table.kvt th, table.kvt td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); } table.kvt td + td, table.kvt th + th { text-align: right; }
.perf summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; }
.btn.mini { min-height: 40px; min-width: 40px; padding: 4px 8px; margin-left: 4px; }
.btn.mini[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
ol.steps { margin: 4px 0 0; padding-left: 22px; } ol.steps li { padding: 4px 0; border-bottom: 1px solid var(--line); }
ol.steps .tag, .opt .tag { font: 500 10px var(--f-data); letter-spacing: .06em; text-transform: uppercase; color: var(--amber); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { background: none; border: 0; min-height: 44px; padding: 4px 14px; font: 500 12px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.check { border-left: 3px solid var(--good); padding: 8px 10px; background: var(--panel-2); border-radius: 3px; margin-top: 10px; display: grid; gap: 6px; font-size: 14px; }
.check.bad { border-left-color: var(--bad); } .check.warn { border-left-color: var(--amber); }
.check ol { margin: 0; padding-left: 20px; }
.msg-err { color: var(--bad); } .msg-warn { color: var(--amber); }
input.txt, select.txt { width: 100%; min-height: 44px; margin: 2px 0 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; font: 16px var(--f-ui); } /* 16px: iOS does not zoom on focus */
.dice li > div:first-child { font-size: 13px; }
/* scene sequencer (contract 3) */
.now { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-top: 10px; font-size: 13px; }
.plan { display: grid; gap: 10px; margin-top: 10px; }
.seqcard { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px 8px; background: var(--panel); }
.seqcard.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.seqhead { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.seqhead b { font: 600 12px var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.seqhead .seqlbl { flex: 1 1 140px; width: auto; margin: 0; min-height: 44px; }
.seqhead .btn.mini { margin-left: 0; }
.plan .btn.mini, .palette .btn.mini, .interrupt .btn { min-height: 44px; }
ol.steps li.step { list-style: decimal; }
li.step .srow { display: flex; gap: 8px; align-items: flex-start; }
li.step .ico { flex: 0 0 22px; text-align: center; font-weight: 600; }
li.step .lbl.verb { white-space: pre-wrap; font-family: var(--f-read); }
li.step .planned { font: italic 12px var(--f-read); color: var(--dim); border-left: 2px dashed var(--line); padding-left: 8px; margin: 2px 0 2px 30px; }
li.step > .msg-err, li.step > .msg-warn, li.step > .note, li.step > .row, li.step > input, li.step > select { margin-left: 30px; font-size: 13px; }
li.step .ctl { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px; }
li.step .ctl .btn.mini { margin-left: 0; min-height: 44px; min-width: 44px; }
li.st-fix .ico { color: var(--bad); } li.st-risky .ico { color: var(--amber); } li.st-ok .ico { color: var(--good); } li.st-gm .ico, li.st-branch .ico, li.st-case .ico { color: var(--accent); }
li.st-waits { opacity: .62; } li.st-invalidated { opacity: .5; text-decoration: line-through; }
li.halt { list-style: none; margin: 6px 0 6px -22px; padding: 6px 10px; border: 1px dashed var(--amber); border-radius: 3px; color: var(--amber); font-size: 13px; }
.branch { margin: 4px 0 0 30px; display: grid; gap: 6px; }
.case { border-left: 2px solid var(--line); padding: 4px 0 4px 8px; } .case.active { border-left-color: var(--accent); }
.case textarea.when, .ed textarea { width: 100%; min-height: 44px; resize: none; overflow-y: hidden; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; font: 16px/1.45 var(--f-read); }
.btn.mini.pre { border-style: dashed; margin-left: 0; text-align: left; }
.palette { display: grid; gap: 8px; }
.palgrp h3 { margin: 6px 0 4px; font: 500 10px var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.palgrid { display: grid; grid-template-columns: 1fr; gap: 6px; }
@media (min-width: 700px) { .palgrid { grid-template-columns: 1fr 1fr; } }
.pal { display: grid; gap: 4px; min-width: 0; }
.palbtn { display: flex; gap: 8px; align-items: flex-start; width: 100%; text-align: left; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2); }
.palbtn:hover:not([disabled]) { border-color: var(--accent); }
.palbtn[disabled] { opacity: .6; cursor: not-allowed; background: transparent; border-style: dashed; }
.palbtn .ico { flex: 0 0 18px; font-weight: 600; color: var(--accent); } .pal.st-risky .ico { color: var(--amber); } .pal.st-not_here .ico { color: var(--bad); }
.palbtn .lbl { min-width: 0; } .palbtn small { display: block; color: var(--dim); font-size: 12px; } small.why { color: var(--amber); }
.pal.st-not_here small.why { color: var(--bad); }
.ed { display: grid; gap: 6px; } .ed label { font-size: 12px; color: var(--dim); }
.opt.off { opacity: .6; } .opt.off small.why { color: var(--amber); }
.submitbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.submitbar.sticky { position: sticky; bottom: 0; z-index: 3; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 0; }
@media (max-width: 960px) { .submitbar.sticky { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); } }
.interrupt ol.dead li { text-decoration: line-through; color: var(--dim); }
.palnav { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 4px 0; }
.palnav::-webkit-scrollbar { display: none; }
.chip.mini { flex: 0 0 auto; min-height: 44px; padding: 10px 14px; text-decoration: none; color: var(--fg); font-size: 13px; }
.note.added { color: var(--good); min-height: 1em; } .note.deferred { color: var(--amber); }
.palgrp, .plan { scroll-margin-top: 56px; }
li.step .srow { cursor: pointer; min-height: 44px; align-items: center; }
li.step .srow .lbl { flex: 1 1 auto; } li.step .srow .more { color: var(--dim); flex: 0 0 auto; padding: 0 4px; }
li.step .note.cond { margin-left: 30px; color: var(--amber); }
.palbtn .lbl small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; color: inherit; }
@media (min-width: 701px) { .only-phone { display: none !important; } }
@media (max-width: 700px) { li.step:not(.open) > .ctl, li.step:not(.open) > input.cond-in { display: none; } }
</style>

<div class="app" id="app" data-tab="scene">
  <section class="col left" id="colLeft" aria-label="Aero"></section>
  <section class="col center" id="colCenter" aria-label="Scene"></section>
  <section class="col right" id="colRight" aria-label="Record"></section>
  <section class="col gear" id="colGear" aria-label="Gear"></section>
</div>

  <button role="tab" data-t="scene" aria-selected="true">Scene</button>
  <button role="tab" data-t="aero" aria-selected="false">Aero</button>
  <button role="tab" data-t="gear" aria-selected="false">Gear</button>
  <button role="tab" data-t="journal" aria-selected="false">Journal</button>
</nav>
<button class="jump-new" id="jumpNew" type="button" hidden aria-label="Jump to the newest story entry">Newest ↓</button>

<script>
/* Genesis composite-turn contract: parse + preflight validation.
 *
 * ONE implementation, two hosts: the Datapad inlines this file (build_datapad.py) for the live
 * preview, and the GM turn processor runs it under node (`node turn_contract.js validate ...`)
 * before any die is rolled. Same input, same verdict.
 *
 * Inputs are PLAYER-VISIBLE only. `ctx` (the turn context) is published by the GM in view/state
 * and never contains hidden stats, DCs, enemy HP or hidden capabilities. The validator therefore
 * cannot leak them, and it never predicts dice.
 *
 * Declaration shape (the same for composer selections and parsed free text):
 *   { actor, source: "composer"|"freeform", freeform: "...",
 *     speech:  { option: "d1"|null, text: "...", approach: "...", extended: false } | null,
 *     actions: [ { option: "burst", target: "dog_a"|null, trigger: "..."|null } ],   // primary actions
 *     bonus_actions: [ { option: "...", target: null } ],
 *     movement: { option: "to_ramp" } | null,
 *     objects: [ "ignite_saber" ],                        // object interactions
 *     reactions: [ "sentinel_balance" ],                  // declared reaction intents (conditional)
 *     unmapped: [ "text the parser could not map" ],
 *     steps: [ { type: "speech"|"action"|"bonus_action"|"move"|"object"|"free", option, target, trigger, text,
 *                condition: { text } | absent, pending: true | absent, authorized: true | absent } ] }
 * `steps` (turn-contract/2, optional) is the player's order; the other fields are derived from it.
 *
 * Optional turn-context fields read by contract 2 (published by the GM from committed events only):
 *   hands: { right: {item, label} | null, left: {...} | null }       hand occupancy, when an event states it
 *   objects[].frees_hand ("left"|"right"), objects[]/options[].needs_hands (n, momentary use),
 *   objects[]/options[].takes_hands (n, the item is then held), .at (visible id where it is used),
 *   .reach_ft (default 5 for `at`), pending_steps: [steps] left from a halted sequence.
 *   contract 3: objects[].frees_item (frees whichever hand holds that item), options/objects/moves .grants/.removes
 *   (planned flags, applied in step order), .unless [flags that make it pointless], .at_free (no place needed), .risk (visible risk text), movement[].ends_at, position_label,
 *   plan_result {stop_kind, reason, completed, pending, invalidated}, pending_steps[].status.
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.GenesisTurn = api;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";
  var VERSION = "turn-contract/3";  // reads turn-contract/1 (no `steps`) and /2 (no ids, seq or branches) unchanged

  function byId(list, id) { for (var i = 0; i < (list || []).length; i++) if (list[i].id === id) return list[i]; return null; }
  function lc(s) { return String(s || "").toLowerCase(); }
  function uniq(a) { var o = []; a.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function names(ctx, ids) { return ids.map(function (id) { var v = byId(ctx.visible, id); return v ? v.label : id; }); }
  function joinAnd(a, w) { return a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " " + (w || "and") + " " + a[a.length - 1]; }

  function emptyDecl(ctx) {
    return { actor: ctx.actor, source: "composer", freeform: "", speech: null, actions: [], bonus_actions: [],
             movement: null, objects: [], reactions: [], unmapped: [] };
  }

  /* ---------- free-text parsing (deterministic, alias-driven, order-preserving) ----------
   * The GM publishes aliases with every option. The text is cut into clauses in the player's order
   * (sentences, ";", "then", "and then", "after that"); quoted speech keeps its place. Every match
   * becomes a step, so conflicts surface in validation instead of being silently resolved. A clause
   * that matches nothing is kept as a free step (and in `unmapped`), never dropped. A clause with
   * "if", "unless", "depending on"... marks its steps as conditional: the GM stops before them unless
   * what the character already knows settles the condition. The GM processor re-reads the text with

    var L = ui.sel.steps.map(function (x, i) { return [x, i]; });
    L.sort(function (a, b) { return (a[0].seq || 0) - (b[0].seq || 0) || a[1] - b[1]; });
    ui.sel.steps = L.map(function (p) { return p[0]; });
  }
  function moveStep(id, dir) {
    var f = locate(id); if (!f) return;
    var L = f.list, i = f.index, x = L[i], j = i + dir;
    if (f.parent) { if (j < 0 || j >= L.length) return; L.splice(j, 0, L.splice(i, 1)[0]); return; }
    var nb = L[j];
    if (nb && (nb.seq || 0) === (x.seq || 0)) { L[i] = nb; L[j] = x; return; }
    var ns = (x.seq || 0) + dir; if (ns < 0 || ns >= ui.sel.nseq) return;  // across a sequence boundary
    x.seq = ns; sortSeq();
  }
  function makeStep(key) {
    var k = key.indexOf(":"), t = key.slice(0, k), id = key.slice(k + 1), st = { id: newId(), type: t, option: id };
    if (t === "action" || t === "bonus_action") { st.target = null; st.trigger = null; }
    return st;
  }
  function addAtActive(st) {
    var w = activeWhere(ui.sel), out = T.insertStep(ui.sel.steps, w, st);
    ui.sel.steps = out;
    var c = ctxOf(view), where = w.branch ? "this decision" : "Sequence " + (w.seq + 1);
    ui.lastAdded = "Added to " + where + ": " + (c ? stepLabel(c, st) : st.type) + ".";
  }
  function bindCenter() {
    function on(id, ev, fn) { var el = $(id); if (el) el.addEventListener(ev, fn); }
    function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
    function click(attr, fn) { each("[" + attr + "]", function (b) { b.addEventListener("click", function () { fn(b.getAttribute(attr), b); }); }); }
    var deb = null;
    function soft(fn) { return function (e) { fn(e.target.value); ui.confirmed = false; ui.draftId = ""; autoGrow(e.target); clearTimeout(deb); deb = setTimeout(function () { saveUi(); refreshLive(); }, 250); }; }
    each("[data-mode]", function (b) { b.addEventListener("click", function () { ui.mode = b.getAttribute("data-mode"); changed(); }); });
    each("input[data-g]", function (el) { el.addEventListener("change", function () { ui.sel[el.getAttribute("data-g")] = el.value; changed(); }); });
    each("input[data-c]", function (el) {
      el.addEventListener("change", function () {
        var g = el.getAttribute("data-c"), list = ui.sel[g].filter(function (x) { return x !== el.value; });
        if (el.checked) list.push(el.value); ui.sel[g] = list; changed();
      });
    });
    on("w_target", "change", function () { ui.sel.target[ui.sel.action] = $("w_target").value; changed(); });

    /* scene plan: every change is the player's explicit tap; nothing is added, removed or reordered otherwise */
    click("data-pal", function (key) {
      if (key.indexOf("speech:") === 0) addAtActive({ id: newId(), type: "speech", option: key.slice(7) });
      else addAtActive(makeStep(key));
      changed();
    });
    click("data-pre", function (key) { addAtActive(makeStep(key)); changed(); });
    click("data-fix", function (v) {
      var p = v.split("|"), f = locate(p[0]); if (!f) return;
      var st = makeStep(p[1]); st.seq = f.list[f.index].seq; f.list.splice(f.index, 0, st); changed();
    });
    click("data-how", function (label) {
      ui.sel.actDraft = (ui.sel.actDraft ? ui.sel.actDraft + "\n" : "") + "How Aero does it (" + label + "): ";
      saveUi(); render(); var t = $("w_act"); if (t) { t.focus(); try { t.setSelectionRange(t.value.length, t.value.length); } catch (x) {} t.scrollIntoView({ block: "center" }); }
    });
    on("addSay", "click", function () { var t = $("w_say") ? $("w_say").value : ""; if (!t.trim()) return; addAtActive({ id: newId(), type: "speech", text: t.replace(/\s+$/, "") }); ui.sel.sayDraft = ""; changed(); });
    on("addAct", "click", function () { var t = $("w_act") ? $("w_act").value : ""; if (!t.trim()) return; addAtActive({ id: newId(), type: "free", text: t.replace(/\s+$/, ""), kind: "custom" }); ui.sel.actDraft = ""; changed(); });
    on("addBranch", "click", function () {
      var b = { id: newId(), type: "branch", otherwise: "stop", cases: [{ when: "", after: "continue", steps: [] }] };
      addAtActive(b); ui.sel.active = { branch: b.id, "case": 0 }; changed();
      var t = $("w_when_" + b.id + "_0"); if (t) t.focus();
    });
    on("addSeq", "click", function () { ui.sel.nseq++; ui.sel.labels.push(""); ui.sel.active = { seq: ui.sel.nseq - 1 }; changed(); });
    click("data-act-seq", function (q) { ui.sel.active = { seq: +q }; saveUi(); render(); var p = $("palette"); if (p && window.innerWidth < 961) p.scrollIntoView({ block: "start" }); });
    click("data-act-case", function (v) { var p = v.split(":"); ui.sel.active = { branch: p[0], "case": +p[1] }; saveUi(); render(); });
    click("data-del-seq", function (q) {
      q = +q; if (ui.sel.steps.some(function (x) { return (x.seq || 0) === q; }) || ui.sel.nseq < 2) return;
      ui.sel.steps.forEach(function (x) { if ((x.seq || 0) > q) x.seq--; });
      ui.sel.labels.splice(q, 1); ui.sel.nseq--; ui.sel.active = { seq: Math.min(q, ui.sel.nseq - 1) }; changed();
    });
    each("[data-open]", function (el) {
      function tog() { var id = el.getAttribute("data-open"); ui.openStep = ui.openStep === id ? null : id; saveUi(); render(); }
      el.addEventListener("click", tog); el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } });
    });
    click("data-up", function (id) { ui.openStep = id; moveStep(id, -1); changed(); var el = document.querySelector('[data-sid="' + id + '"]'); if (el) el.scrollIntoView({ block: "center" }); });
    click("data-down", function (id) { ui.openStep = id; moveStep(id, 1); changed(); var el = document.querySelector('[data-sid="' + id + '"]'); if (el) el.scrollIntoView({ block: "center" }); });
    click("data-del", function (id) {
      var f = locate(id); if (!f) return; var x = f.list.splice(f.index, 1)[0];
      if (ui.sel.active.branch === id) ui.sel.active = { seq: x.seq || 0 }; changed();
    });
    click("data-cond", function (id) { var f = locate(id); if (!f) return; var x = f.list[f.index]; if (x.condition) delete x.condition; else x.condition = { text: "" }; changed(); });
    click("data-after", function (v) { var p = v.split(":"), f = locate(p[0]); if (!f) return; var k = f.list[f.index].cases[+p[1]]; k.after = k.after === "stop" ? "continue" : "stop"; changed(); });
    click("data-add-case", function (id) { var f = locate(id); if (!f) return; var b = f.list[f.index]; b.cases.push({ when: "", after: "continue", steps: [] }); ui.sel.active = { branch: id, "case": b.cases.length - 1 }; changed(); });
    click("data-del-case", function (v) { var p = v.split(":"), f = locate(p[0]); if (!f) return; f.list[f.index].cases.splice(+p[1], 1); ui.sel.active = { seq: f.list[f.index].seq || 0 }; changed(); });
    click("data-other", function (v) { var p = v.split(":"), f = locate(p[0]); if (!f) return; f.list[f.index].otherwise = p[1] === "continue" ? "continue" : "stop"; changed(); });
    T.flat(ui.sel.steps || []).forEach(function (x) {
      on("w_cond_" + x.id, "input", soft(function (v) { x.condition = { text: v }; }));
      on("w_cond_" + x.id, "change", function () { saveUi(); render(); });
      on("w_tgt_" + x.id, "change", function (e) { x.target = e.target.value || null; changed(); });
      (x.cases || []).forEach(function (k, j) {
        on("w_when_" + x.id + "_" + j, "input", soft(function (v) { k.when = v; }));
        on("w_when_" + x.id + "_" + j, "change", function () { saveUi(); render(); });
      });
    });
    for (var q = 0; q < (ui.sel.nseq || 1); q++) (function (q) { on("w_lbl_" + q, "input", soft(function (v) { ui.sel.labels[q] = v; })); })(q);
    on("w_say", "input", function (e) { ui.sel.sayDraft = e.target.value; autoGrow(e.target); saveUi(); });
    on("w_act", "input", function (e) { ui.sel.actDraft = e.target.value; autoGrow(e.target); saveUi(); });
    on("continuePending", "click", function () { var c = ctxOf(view); if (c) { loadDeclaration({ actor: c.actor, steps: (c.pending_steps || []).filter(function (x) { return continuable(c, x); }) }, c, true); render(); } });
    on("editAsSteps", "click", function () { var c = ctxOf(view); if (c) { loadDeclaration(T.parseFreeform(ui.write, c), c, false); render(); } });
    on("w_own", "input", soft(function (x) { ui.sel.own = x; }));
    on("w_trigger", "input", soft(function (x) { ui.sel.trigger = x; }));
    on("w_note", "input", soft(function (x) { ui.note = x; }));
    on("w_write", "input", soft(function (x) { ui.write = x; ls("datapad.draft", x); }));
    bindLive();
    each(".composer textarea", autoGrow);
    Array.prototype.forEach.call(document.querySelectorAll("[data-ralt]"), function (b) {
      b.addEventListener("click", function () {
        var p = b.getAttribute("data-ralt").split(":"), a = actions.filter(function (x) { return x._id === p[0]; })[0];
        var alt = a && a.review && a.review.alternatives[+p[1]]; if (alt && ctxOf(view)) { loadDeclaration(alt.declaration, ctxOf(view)); render(); }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-wd]"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-wd"), a = actions.filter(function (x) { return x._id === id; })[0];
        if (!a || a.status !== "submitted") { setMsg("Already picked up by the GM."); return; }
        dbRef.doc("actions/" + id).delete().catch(function (e) { setMsg("Could not withdraw: " + (e && e.code || "error")); });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-nudge]"), function (b) { b.addEventListener("click", function () { notifyGM(b.getAttribute("data-nudge")); }); });
  }

  /* Live preflight while typing: update only the check panel, the "Read as" line and the submit bar,
     so a text box is never rebuilt under the player's keyboard. */
  function bindLive() {
    var cr = $("confirmRisk"); if (cr) cr.addEventListener("change", function () { ui.confirmed = cr.checked; saveUi(); refreshLive(); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-alt]"), function (b) {
      b.addEventListener("click", function () { var r = window.__lastValidation; var a = r && r.alternatives[+b.getAttribute("data-alt")]; if (a) { loadDeclaration(a.declaration, ctxOf(view)); render(); } });
    });
    var sb = $("submitTurn"); if (sb && !sb.__bound) { sb.__bound = true; sb.addEventListener("click", submitTurn); }
    var cl = $("clearTurn"); if (cl && !cl.__bound) { cl.__bound = true; cl.addEventListener("click", function () { ui = freshUi(ui.ctxId); saveUi(); render(); }); }
    var jf = $("jumpFix"); if (jf && !jf.__bound) { jf.__bound = true; jf.addEventListener("click", function () { var el = document.querySelector(".step.st-fix") || $("liveCheck"); if (el) el.scrollIntoView({ block: "center" }); }); }
  }
  function refreshLive() {
    var c = ctxOf(view), lc = $("liveCheck");
    if (!c || !lc) { if (!c && $("submitTurn")) $("submitTurn").disabled = !!(activeAction() || !ui.write.trim() || status !== "live" || phase); return; }
    var busy = activeAction(), d = declaration(c), r = safeValidate(d, c), stat = safeStatus(r);
    window.__lastValidation = r;
    lc.innerHTML = checkPanel(r);
    var ra = $("readAs"); if (ra) ra.textContent = "Read as: " + (r.preview.map(function (p) { return p.text; }).join(" → ") || "nothing matched yet");
    var rs = $("readAsSteps"); if (rs) rs.innerHTML = readAsInner(c, r, stat);
    var bar = $("submitBar"); if (bar) bar.innerHTML = submitBar(r, stat, busy);
    bindLive();
  }
  function autoGrow(el) {
    if (!el || el.tagName !== "TEXTAREA") return;
    var col = el.closest(".col"), y = col ? col.scrollTop : 0, wy = window.scrollY;
    el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px";
    el.style.overflowY = el.scrollHeight + 2 > el.clientHeight + 1 ? "auto" : "hidden";
    if (col) col.scrollTop = y; window.scrollTo(window.scrollX, wy);
  }

  /* "Newest" button: jumps to the latest story entry; hidden while that entry is on screen. */
  var jumpObs = null;
  function watchNewest() {
    var btn = $("jumpNew"), items = document.querySelectorAll("#colCenter .feed > div");
    if (!btn) return;
    var last = items[items.length - 1];
    if (jumpObs) jumpObs.disconnect();
    if (!last) { btn.hidden = true; return; }
    if (!("IntersectionObserver" in window)) { btn.hidden = false; return; }
    // hidden while the newest entry is on screen, and while the turn builder is (it would cover palette buttons)
    var seen = { last: false, comp: false }, comp = document.querySelector(".composer");
    jumpObs = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.target === last) seen.last = e.isIntersecting; else seen.comp = e.isIntersecting; });
      btn.hidden = seen.last || seen.comp;
    });
    jumpObs.observe(last); if (comp) jumpObs.observe(comp);
  }
  (function () {
    var btn = $("jumpNew"); if (!btn) return;
    btn.addEventListener("click", function () {
      var items = document.querySelectorAll("#colCenter .feed > div"), last = items[items.length - 1];
      if (!last) return;
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      last.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    });
  })();

  function submitTurn() {
    var c = ctxOf(view), busy = activeAction();
    if (busy || !dbRef || phase) return;
    var d = c ? declaration(c) : null, r = c ? safeValidate(d, c) : null;
    if (c && (!r.legal || (r.needs_confirmation && !ui.confirmed))) return;
    var text = c ? turnText(d, r) : ui.write.trim();
    if (!text) return;
    phase = "validating"; render();
    var seenRev = view.revision, seenHead = view.ledger_head;
    // The store may have moved on since this plan was checked: re-read it first and never submit against an old scene.
    dbRef.doc("view/state").get().then(function (vs) {
      var cur = vs && vs.exists ? vs.data() : null;
      if (cur && (cur.revision !== seenRev || cur.ledger_head !== seenHead)) {
        view = cur; phase = ""; render();
        setMsg("The scene moved on (revision " + seenRev + " → " + cur.revision + "). Your plan is kept and re-checked; review it and submit again.");
        return;
      }
      saveAction(c, d, r, text);
    }, function () { saveAction(c, d, r, text); });
  }
  function saveAction(c, d, r, text) {
    if (!ui.draftId) { ui.draftId = "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); saveUi(); }
    var id = ui.draftId, ref = dbRef.doc("actions/" + id);
    var doc = { text: text, declaration: d, source: c ? (ui.mode === "write" ? "freeform" : "composer") : "freeform", actor: view.active_actor || "aero",
      campaign_id: view.campaign_id || "starwars_litrpg", based_on_revision: view.revision, ledger_head: view.ledger_head, context_id: c ? c.context_id : null,
      contract: T.VERSION, confirmed_warnings: !!(r && r.needs_confirmation), warnings: r ? r.warnings.map(function (w) { return w.message; }) : [],
      preflight: r ? { legal: r.legal, crashed: !!r.crashed, codes: r.errors.map(function (e) { return e.code; }).concat(r.warnings.map(function (w) { return w.code; })) } : null,
      status: "submitted", created_ms: Date.now() };
    // Idempotent create: the id is minted once per draft; if a retry finds the document, it is never overwritten.
    ref.get().then(function (snap) { return snap.exists ? null : ref.set(doc); }).then(function () {
      localPending = { id: id, at: Date.now(), text: text };
      ui = freshUi(c ? c.context_id : null); ls("datapad.draft", ""); saveUi(); phase = ""; render(); notifyGM(id);
    }, function (e) { phase = ""; render(); setMsg("Not saved (" + (e && e.code || "error") + "). Your turn is still here; try again."); });
  }

  function notifyGM(id) {
    if (!view.processor) { notifyState[id] = { ok: false, code: "no_processor" }; render(); return; }
    if (!mcpNs) { notifyState[id] = { ok: false, code: "mcp_unavailable" }; render(); return; }
    notifyState[id] = { state: "sending" }; render();
    mcpNs.callTool(view.processor.server, "fire_trigger", { trigger_id: view.processor.trigger_id, text: JSON.stringify({ campaign_id: view.campaign_id, action_id: id }) })
      .then(function () { notifyState[id] = { ok: true, at: Date.now() }; render(); },
            function (e) { notifyState[id] = { ok: false, code: (e && e.code) || "error" }; render(); });
  }

  Array.prototype.forEach.call(document.querySelectorAll("#tabbar button"), function (b) {
    b.addEventListener("click", function () {
      $("app").setAttribute("data-tab", b.getAttribute("data-t"));
      Array.prototype.forEach.call(document.querySelectorAll("#tabbar button"), function (x) { x.setAttribute("aria-selected", String(x === b)); });
      window.scrollTo(0, 0);
    });
  });

  /* ---------- data: subscribe once ---------- */
  var timer = setTimeout(function () { if (!view) { status = "error"; err = "The campaign store has not answered yet. It may be offline."; render(); } }, 10000);
  setInterval(function () { if (activeAction()) render(); }, 30000);  // refresh "processing for N min" labels only while a turn is out
  function start(db) {
    dbRef = db; status = "live";
    db.doc("view/state").onSnapshot(function (snap) {
      if (snap.exists) { view = snap.data(); clearTimeout(timer); }
      render();
    }, function (e) { status = "error"; err = "Store error: " + (e && e.code); render(); });
    db.collection("usage").orderBy("started_ms", "desc").limit(50).onSnapshot(function (q) {
      usage = q.docs.map(function (d) { return d.data(); }); render();
    }, function () {});
    db.collection("actions").orderBy("created_ms", "desc").limit(10).onSnapshot(function (q) {
      actions = q.docs.map(function (d) { var x = Object.assign({}, d.data()); x._id = d.id; return x; })
        .filter(function (a) { return !view || !view.campaign_id || (a.campaign_id || "starwars_litrpg") === view.campaign_id; });
      render();
    }, function () {});
  }
  render();
  if (window.claude && window.claude.use) {
    window.claude.use("db").then(function (db) { if (db) start(db); else { status = "unavailable"; clearTimeout(timer); render(); } }, function () { status = "unavailable"; render(); });
    window.claude.use("mcp").then(function (m) { mcpNs = m; render(); }, function () { mcpNs = null; });
  } else { status = "unavailable"; render(); }
})();
</script>
