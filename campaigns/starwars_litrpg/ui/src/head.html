<title>Genesis Datapad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: desktop = three-column command center (character | scene | record).
   Phone = one column with a bottom tab bar (Scene / Aero / Gear / Journal). */
:root {
  --bg: #e9eef1;          /* datapad paper */
  --panel: #f6f9fb;
  --panel-2: #dfe7ec;
  --line: #b7c6cf;
  --fg: #14232d;
  --dim: #55697a;
  --accent: #0a6f8f;      /* scanner cyan */
  --accent-fg: #ffffff;
  --amber: #8f5a00;       /* warning / pending */
  --good: #1f7a4d;
  --bad: #a33a2a;
  --f-ui: "Chakra Petch", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, serif;
  --f-data: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070d13; --panel: #0d1721; --panel-2: #132431; --line: #1f3a4d; --fg: #d5e4ec; --dim: #7f98a8;
    --accent: #4fc3e6; --accent-fg: #04202b; --amber: #f0b64a; --good: #54c98c; --bad: #ee7c68; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070d13; --panel: #0d1721; --panel-2: #132431; --line: #1f3a4d; --fg: #d5e4ec; --dim: #7f98a8;
  --accent: #4fc3e6; --accent-fg: #04202b; --amber: #f0b64a; --good: #54c98c; --bad: #ee7c68; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-ui);
  padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; gap: 12px; grid-template-columns: 290px minmax(0, 1fr) 330px; height: calc(100% - 10px); min-height: 0; }
.col { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
.panel > h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.mirror { font: 11px var(--f-data); color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pill { font: 500 10px var(--f-data); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border: 1px solid var(--line); border-radius: 99px; color: var(--dim); white-space: nowrap; }
.pill.fact { color: var(--good); border-color: var(--good); }
.pill.report { color: var(--amber); border-color: var(--amber); }
.pill.belief { color: var(--accent); border-color: var(--accent); }
.pill.pend { color: var(--amber); border-color: var(--amber); }
.pill.ok { color: var(--good); border-color: var(--good); }
.hdr h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .02em; text-wrap: balance; }
.hdr .sub { color: var(--dim); font-size: 13px; display: flex; gap: 8px 14px; flex-wrap: wrap; margin-top: 2px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tags span { font: italic 13px var(--f-read); color: var(--dim); border-bottom: 1px solid var(--line); }
.feed { display: flex; flex-direction: column; gap: 12px; }
.feed .meta { font: 500 10px var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.feed .you .meta { color: var(--accent); }
.feed p { margin: 6px 0 0; font: 17px/1.65 var(--f-read); max-width: 68ch; }
.feed p.say { padding-left: 12px; border-left: 2px solid var(--line); }
.feed .you p { color: var(--accent); }
.empty { color: var(--dim); font: italic 15px var(--f-read); }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; text-align: left; min-height: 44px; flex: 1 1 210px; }
.chip:hover { border-color: var(--accent); }
.note { font-size: 12px; color: var(--dim); }
.composer textarea { width: 100%; min-height: 84px; resize: none; overflow-y: hidden; max-height: 60vh; overflow-anchor: none; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 10px; font: 16px/1.5 var(--f-read); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 500; letter-spacing: .04em; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.act { border: 1px dashed var(--line); border-radius: 3px; padding: 8px 10px; margin-top: 8px; display: grid; gap: 4px; }
.act q { font: 15px var(--f-read); quotes: none; }
.bar { height: 8px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.hp i { background: var(--bad); } .bar.st i { background: var(--amber); }
.stat { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: center; margin: 7px 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.stat b { font: 500 13px var(--f-data); }
.pips { display: flex; gap: 5px; } .pips i { width: 14px; height: 14px; border: 1.5px solid var(--accent); transform: rotate(45deg); } .pips i.on { background: var(--accent); }
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.scores div { text-align: center; border: 1px solid var(--line); border-radius: 3px; padding: 6px 0; }
.scores small { display: block; font: 10px var(--f-data); letter-spacing: .12em; color: var(--dim); }
.scores b { font: 500 18px var(--f-data); } .scores em { font: 12px var(--f-data); color: var(--accent); font-style: normal; margin-left: 4px; }
.portrait { aspect-ratio: 4/3; max-width: 100%; border: 1px solid var(--line); border-radius: 3px; display: grid; place-items: center; background: repeating-linear-gradient(135deg, var(--panel-2) 0 10px, var(--panel) 10px 20px); position: relative; }
.portrait b { font: 600 44px var(--f-ui); letter-spacing: .08em; color: var(--accent); }
.portrait small { position: absolute; bottom: 6px; left: 8px; font: 10px var(--f-data); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.plain li { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
ul.plain li:last-child { border-bottom: 0; }
details summary { cursor: pointer; font-weight: 500; min-height: 28px; }
details p { margin: 4px 0 0; font-size: 13px; color: var(--dim); }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.kv span:last-child { font-family: var(--f-data); }
.tabbar { display: none; }
.jump-new { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; min-height: 44px; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); font: 500 12px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
@media (max-width: 960px) { .jump-new { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); } .app:not([data-tab="scene"]) ~ .jump-new { display: none; } }
.pane { display: contents; }
@media (max-width: 960px) {
  body { padding-block: 8px 0; }
  .app { display: block; height: auto; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .col { overflow: visible; display: none; }
  .app[data-tab="scene"] .col.center, .app[data-tab="aero"] .col.left, .app[data-tab="gear"] .col.gear, .app[data-tab="journal"] .col.right { display: flex; }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
    padding: 0 max(8px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
  .tabbar button { background: none; border: 0; min-height: 56px; font: 500 11px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .tabbar button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
}
@media (min-width: 961px) { .col.gear { display: none; } .only-mobile { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* turn composer */
.budget { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.pill.used { opacity: .55; text-decoration: line-through; }
fieldset.grp { border: 1px solid var(--line); border-radius: 3px; margin: 10px 0 0; padding: 4px 8px 6px; min-width: 0; }
fieldset.grp legend { font: 500 10px var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); padding: 0 4px; }
fieldset[disabled] { opacity: .6; }
.opt { display: flex; gap: 10px; align-items: flex-start; min-height: 40px; padding: 6px 4px; border-radius: 3px; cursor: pointer; }
.opt:hover { background: var(--panel-2); }
.opt input { margin: 3px 0 0; accent-color: var(--accent); width: 18px; height: 18px; flex: 0 0 auto; }
.opt .lbl { min-width: 0; } .opt .lbl small { display: block; color: var(--dim); font-size: 12px; }
table.kvt { width: 100%; border-collapse: collapse; font: 12px var(--f-data); margin-top: 6px; } table.kvt th, table.kvt td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); } table.kvt td + td, table.kvt th + th { text-align: right; }
.perf summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; }
.btn.mini { min-height: 40px; min-width: 40px; padding: 4px 8px; margin-left: 4px; }
.btn.mini[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
ol.steps { margin: 4px 0 0; padding-left: 22px; } ol.steps li { padding: 4px 0; border-bottom: 1px solid var(--line); }
ol.steps .tag, .opt .tag { font: 500 10px var(--f-data); letter-spacing: .06em; text-transform: uppercase; color: var(--amber); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { background: none; border: 0; min-height: 36px; padding: 4px 14px; font: 500 12px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.check { border-left: 3px solid var(--good); padding: 8px 10px; background: var(--panel-2); border-radius: 3px; margin-top: 10px; display: grid; gap: 6px; font-size: 14px; }
.check.bad { border-left-color: var(--bad); } .check.warn { border-left-color: var(--amber); }
.check ol { margin: 0; padding-left: 20px; }
.msg-err { color: var(--bad); } .msg-warn { color: var(--amber); }
input.txt, select.txt { width: 100%; min-height: 40px; margin: 2px 0 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; font: 15px var(--f-ui); }
.dice li > div:first-child { font-size: 13px; }
</style>

<div class="app" id="app" data-tab="scene">
  <section class="col left" id="colLeft" aria-label="Aero"></section>
  <section class="col center" id="colCenter" aria-label="Scene"></section>
  <section class="col right" id="colRight" aria-label="Record"></section>
  <section class="col gear" id="colGear" aria-label="Gear"></section>
</div>
<nav class="tabbar" id="tabbar" role="tablist" aria-label="Sections">
  <button role="tab" data-t="scene" aria-selected="true">Scene</button>
  <button role="tab" data-t="aero" aria-selected="false">Aero</button>
  <button role="tab" data-t="gear" aria-selected="false">Gear</button>
  <button role="tab" data-t="journal" aria-selected="false">Journal</button>
</nav>
<button class="jump-new" id="jumpNew" type="button" hidden aria-label="Jump to the newest story entry">Newest ↓</button>
