# Faction Hideout System
# Unified Approach: SW5e/FFG Hybrid System
# Comprehensive hideout mechanics, customization, and functionality

hideout_system:
  # ========================================
  # HIDEOUT TYPES AND PROGRESSION
  # ========================================
  
  hideout_types:
    # Basic Hideout - Rank 1
    safe_house:
      name: "Safe House"
      description: "Basic safe location for faction members"
      size: "Small (1-5 people)"
      cost: "Low (1,000-5,000 credits)"
      construction_time: "1-2 weeks"
      features:
        - "Basic shelter and protection"
        - "Communication access"
        - "Medical supplies"
        - "Basic equipment storage"
        - "Simple security measures"
      capacity:
        personnel: "1-5 members"
        equipment: "Basic storage"
        vehicles: "1-2 small vehicles"
      maintenance_cost: "100-500 credits/month"
    
    # Established Base - Rank 3
    faction_base:
      name: "Faction Base"
      description: "Established faction facility"
      size: "Medium (5-20 people)"
      cost: "Medium (10,000-50,000 credits)"
      construction_time: "1-3 months"
      features:
        - "Training facilities"
        - "Equipment storage and workshop"
        - "Medical bay"
        - "Command center"
        - "Living quarters"
        - "Security systems"
        - "Basic research facilities"
      capacity:
        personnel: "5-20 members"
        equipment: "Extensive storage"
        vehicles: "3-5 vehicles"
      maintenance_cost: "1,000-5,000 credits/month"
    
    # Major Facility - Rank 5
    faction_stronghold:
      name: "Faction Stronghold"
      description: "Major faction military facility"
      size: "Large (20-100 people)"
      cost: "High (100,000-500,000 credits)"
      construction_time: "3-6 months"
      features:
        - "Full military facilities"
        - "Ship hangars and maintenance"
        - "Advanced medical facilities"
        - "Strategic command center"
        - "Research and development labs"
        - "Advanced security systems"
        - "Living quarters and recreation"
        - "Diplomatic chambers"
      capacity:
        personnel: "20-100 members"
        equipment: "Massive storage"
        vehicles: "10-20 vehicles"
        starships: "2-5 starships"
      maintenance_cost: "10,000-50,000 credits/month"
    
    # Legendary Facility - Rank 7+
    faction_headquarters:
      name: "Faction Headquarters"
      description: "Legendary faction headquarters"
      size: "Massive (100+ people)"
      cost: "Very High (1,000,000+ credits)"
      construction_time: "6-12 months"
      features:
        - "Complete military complex"
        - "Multiple ship hangars"
        - "Advanced research facilities"
        - "Diplomatic chambers"
        - "Advanced medical and cloning facilities"
        - "Ultimate security systems"
        - "Complete living facilities"
        - "Entertainment and recreation"
        - "Galactic communication networks"
      capacity:
        personnel: "100+ members"
        equipment: "Unlimited storage"
        vehicles: "Unlimited vehicles"
        starships: "10+ starships"
      maintenance_cost: "100,000+ credits/month"

  # ========================================
  # HIDEOUT CUSTOMIZATION OPTIONS
  # ========================================
  
  hideout_customization:
    # Security Customizations
    security_upgrades:
      basic_security:
        name: "Basic Security System"
        description: "Standard security measures"
        cost: "Low (1,000-5,000 credits)"
        installation_time: "1 week"
        benefits:
          - "Basic protection against intruders"
          - "Simple alarm systems"
          - "Basic access control"
          - "Surveillance cameras"
        maintenance_cost: "100-500 credits/month"
      
      advanced_security:
        name: "Advanced Security System"
        description: "Enhanced security measures"
        cost: "Medium (10,000-25,000 credits)"
        installation_time: "2-3 weeks"
        benefits:
          - "Enhanced protection against intruders"
          - "Advanced alarm systems"
          - "Biometric access control"
          - "Advanced surveillance systems"
          - "Automated defense systems"
        maintenance_cost: "500-2,000 credits/month"
      
      military_security:
        name: "Military-Grade Security"
        description: "Military-level security systems"
        cost: "High (50,000-100,000 credits)"
        installation_time: "1-2 months"
        benefits:
          - "Maximum protection against intruders"
          - "Military-grade alarm systems"
          - "Advanced biometrics and AI monitoring"
          - "Automated weapon systems"
          - "EMP protection"
          - "Stealth detection systems"
        maintenance_cost: "2,000-10,000 credits/month"
      
      ultimate_security:
        name: "Ultimate Security System"
        description: "State-of-the-art security"
        cost: "Very High (200,000+ credits)"
        installation_time: "2-3 months"
        benefits:
          - "Ultimate protection against all threats"
          - "AI-powered monitoring and response"
          - "Quantum encryption and security"
          - "Advanced automated defense systems"
          - "Force field protection"
          - "Complete stealth and detection systems"
        maintenance_cost: "10,000+ credits/month"
    
    # Medical Customizations
    medical_upgrades:
      basic_medical:
        name: "Basic Medical Bay"
        description: "Standard medical facilities"
        cost: "Low (5,000-15,000 credits)"
        installation_time: "2-3 weeks"
        benefits:
          - "Basic healing and treatment"
          - "Medical supplies storage"
          - "Emergency treatment capabilities"
          - "Basic diagnostic equipment"
        maintenance_cost: "200-1,000 credits/month"
      
      advanced_medical:
        name: "Advanced Medical Bay"
        description: "Enhanced medical facilities"
        cost: "Medium (25,000-75,000 credits)"
        installation_time: "1-2 months"
        benefits:
          - "Advanced healing and treatment"
          - "Surgery capabilities"
          - "Medical research facilities"
          - "Advanced diagnostic equipment"
          - "Specialized treatment rooms"
        maintenance_cost: "1,000-5,000 credits/month"
      
      military_medical:
        name: "Military Medical Complex"
        description: "Military-level medical facilities"
        cost: "High (100,000-250,000 credits)"
        installation_time: "2-3 months"
        benefits:
          - "Military-grade healing and treatment"
          - "Advanced surgery and trauma care"
          - "Medical training facilities"
          - "Advanced research capabilities"
          - "Emergency response systems"
          - "Specialized medical equipment"
        maintenance_cost: "5,000-25,000 credits/month"
      
      ultimate_medical:
        name: "Ultimate Medical Complex"
        description: "State-of-the-art medical facilities"
        cost: "Very High (500,000+ credits)"
        installation_time: "3-6 months"
        benefits:
          - "Ultimate healing and treatment capabilities"
          - "Cloning facilities"
          - "Advanced medical research"
          - "Genetic engineering capabilities"
          - "Complete medical training facilities"
          - "Galactic medical network access"
        maintenance_cost: "25,000+ credits/month"
    
    # Workshop Customizations
    workshop_upgrades:
      basic_workshop:
        name: "Basic Workshop"
        description: "Standard workshop facilities"
        cost: "Low (3,000-10,000 credits)"
        installation_time: "2-3 weeks"
        benefits:
          - "Basic repairs and maintenance"
          - "Equipment maintenance capabilities"
          - "Simple crafting facilities"
          - "Basic tool storage"
        maintenance_cost: "150-750 credits/month"
      
      advanced_workshop:
        name: "Advanced Workshop"
        description: "Enhanced workshop facilities"
        cost: "Medium (15,000-50,000 credits)"
        installation_time: "1-2 months"
        benefits:
          - "Advanced repairs and maintenance"
          - "Equipment modification capabilities"
          - "Complex crafting facilities"
          - "Advanced tool storage"
          - "Specialized work areas"
        maintenance_cost: "750-3,000 credits/month"
      
      military_workshop:
        name: "Military Workshop"
        description: "Military-level workshop facilities"
        cost: "High (75,000-200,000 credits)"
        installation_time: "2-3 months"
        benefits:
          - "Military-grade repairs and maintenance"
          - "Weapon modification capabilities"
          - "Military crafting facilities"
          - "Advanced tool and equipment storage"
          - "Specialized military work areas"
          - "Vehicle and starship maintenance"
        maintenance_cost: "3,000-15,000 credits/month"
      
      ultimate_workshop:
        name: "Ultimate Workshop"
        description: "State-of-the-art workshop facilities"
        cost: "Very High (400,000+ credits)"
        installation_time: "3-6 months"
        benefits:
          - "Ultimate repairs and maintenance capabilities"
          - "Advanced modification and enhancement"
          - "Legendary crafting facilities"
          - "Complete tool and equipment storage"
          - "Specialized research and development areas"
          - "Advanced vehicle and starship facilities"
        maintenance_cost: "15,000+ credits/month"
    
    # Training Customizations
    training_upgrades:
      basic_training:
        name: "Basic Training Facility"
        description: "Standard training facilities"
        cost: "Low (2,000-8,000 credits)"
        installation_time: "2-3 weeks"
        benefits:
          - "Basic training capabilities"
          - "Skill development facilities"
          - "Physical conditioning areas"
          - "Basic training equipment"
        maintenance_cost: "100-500 credits/month"
      
      advanced_training:
        name: "Advanced Training Facility"
        description: "Enhanced training facilities"
        cost: "Medium (10,000-35,000 credits)"
        installation_time: "1-2 months"
        benefits:
          - "Advanced training capabilities"
          - "Specialized skills training"
          - "Combat simulation facilities"
          - "Advanced training equipment"
          - "Specialized training areas"
        maintenance_cost: "500-2,500 credits/month"
      
      military_training:
        name: "Military Training Complex"
        description: "Military-level training facilities"
        cost: "High (50,000-150,000 credits)"
        installation_time: "2-3 months"
        benefits:
          - "Military-grade training capabilities"
          - "Tactical simulation facilities"
          - "Leadership development programs"
          - "Advanced military training equipment"
          - "Specialized military training areas"
          - "Combat scenario simulations"
        maintenance_cost: "2,500-12,500 credits/month"
      
      ultimate_training:
        name: "Ultimate Training Complex"
        description: "State-of-the-art training facilities"
        cost: "Very High (300,000+ credits)"
        installation_time: "3-6 months"
        benefits:
          - "Ultimate training capabilities"
          - "Virtual reality simulation facilities"
          - "Mastery development programs"
          - "Advanced training technology"
          - "Complete training environments"
          - "Galactic training network access"
        maintenance_cost: "12,500+ credits/month"
    
    # Communication Customizations
    communication_upgrades:
      basic_communication:
        name: "Basic Communication Center"
        description: "Standard communication facilities"
        cost: "Low (1,500-5,000 credits)"
        installation_time: "1-2 weeks"
        benefits:
          - "Basic communication capabilities"
          - "Network access"
          - "Information sharing systems"
          - "Basic encryption"
        maintenance_cost: "75-375 credits/month"
      
      advanced_communication:
        name: "Advanced Communication Center"
        description: "Enhanced communication facilities"
        cost: "Medium (7,500-25,000 credits)"
        installation_time: "2-3 weeks"
        benefits:
          - "Advanced communication capabilities"
          - "Encrypted networks"
          - "Intelligence gathering systems"
          - "Advanced encryption"
          - "Secure communication channels"
        maintenance_cost: "375-1,875 credits/month"
      
      military_communication:
        name: "Military Communication Complex"
        description: "Military-level communication facilities"
        cost: "High (37,500-100,000 credits)"
        installation_time: "1-2 months"
        benefits:
          - "Military-grade communication capabilities"
          - "Strategic networks"
          - "Command and control systems"
          - "Advanced military encryption"
          - "Secure military channels"
          - "Tactical communication systems"
        maintenance_cost: "1,875-9,375 credits/month"
      
      ultimate_communication:
        name: "Ultimate Communication Complex"
        description: "State-of-the-art communication facilities"
        cost: "Very High (200,000+ credits)"
        installation_time: "2-3 months"
        benefits:
          - "Ultimate communication capabilities"
          - "Quantum networks"
          - "Galactic control systems"
          - "Advanced quantum encryption"
          - "Complete communication networks"
          - "Intergalactic communication access"
        maintenance_cost: "9,375+ credits/month"

  # ========================================
  # HIDEOUT FUNCTIONALITY MECHANICS
  # ========================================
  
  hideout_functionality:
    # Resource Management Systems
    resource_management:
      resource_tracking:
        name: "Resource Tracking"
        description: "Track hideout resources and supplies"
        mechanics:
          - "Resource pools for materials, credits, and supplies"
          - "Supply consumption tracking"
          - "Resource acquisition and distribution"
          - "Resource efficiency monitoring"
        benefits:
          - "Optimized resource usage"
          - "Reduced waste and inefficiency"
          - "Better planning and allocation"
          - "Cost savings and optimization"
      
      personnel_management:
        name: "Personnel Management"
        description: "Manage hideout personnel and assignments"
        mechanics:
          - "Personnel pools with skill tracking"
          - "Skill assignments and rotations"
          - "Training programs and development"
          - "Performance monitoring and evaluation"
        benefits:
          - "Optimized personnel utilization"
          - "Improved skill development"
          - "Better team coordination"
          - "Enhanced operational efficiency"
      
      equipment_management:
        name: "Equipment Management"
        description: "Manage hideout equipment and maintenance"
        mechanics:
          - "Equipment pools with condition tracking"
          - "Maintenance schedules and procedures"
          - "Upgrade programs and modifications"
          - "Equipment efficiency monitoring"
        benefits:
          - "Optimized equipment utilization"
          - "Reduced maintenance costs"
          - "Improved equipment performance"
          - "Extended equipment lifespan"
    
    # Operational Systems
    operational_systems:
      mission_planning:
        name: "Mission Planning"
        description: "Plan and coordinate missions from hideout"
        mechanics:
          - "Mission planning and coordination"
          - "Resource allocation and management"
          - "Success tracking and analysis"
          - "Mission debriefing and improvement"
        benefits:
