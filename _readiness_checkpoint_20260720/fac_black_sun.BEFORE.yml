synergy_engine:
  rules:
  - rule_id: rule_black_sun_class_operative_synergy
    narrative: Operatives find natural homes as Black Sun assassins and spies.
    llm_guidance: Apply when a Black Sun member with the Operative class makes a Stealth
      check during faction-sponsored activities. Represents their specialized training.
    trigger_tags:
    - tag_faction_black_sun
    - tag_class_operative
    trigger_event: on_check
    condition:
      logic: AND
      conditions:
      - type: tag
        target: tag_faction_black_sun
        operator: has
        value: true
      - type: tag
        target: tag_class_operative
        operator: has
        value: true
    effect:
      category: skill_bonus
      target: skill_stealth
      target_scope: self
      bonus_type: circumstance
      value: 1
  - rule_id: rule_black_sun_class_scoundrel_synergy
    narrative: Smugglers and gamblers thrive in the Sun's casinos and trade routes.
    llm_guidance: Apply when a Black Sun member with the Scoundrel class makes a Deception
      check in criminal or underworld contexts. Their experience aligns with syndicate
      needs.
    trigger_tags:
    - tag_faction_black_sun
    - tag_class_scoundrel
    trigger_event: on_check
    condition:
      logic: AND
      conditions:
      - type: tag
        target: tag_faction_black_sun
        operator: has
        value: true
      - type: tag
        target: tag_class_scoundrel
        operator: has
        value: true
    effect:
      category: skill_bonus
      target: skill_deception
      target_scope: self
      bonus_type: circumstance
      value: 1
  - rule_id: rule_black_sun_species_falleen_synergy
    narrative: Falleen are fast-tracked for leadership due to pheromone control and
      cultural ties.
    llm_guidance: Apply when a Falleen Black Sun member makes a Charisma save, representing
      their natural pheromone resistance and manipulation abilities valued by the
      syndicate.
    trigger_tags:
    - tag_faction_black_sun
    - tag_species_falleen
    trigger_event: on_save
    condition:
      logic: AND
      conditions:
      - type: tag
        target: tag_faction_black_sun
        operator: has
        value: true
      - type: tag
        target: tag_species_falleen
        operator: has
        value: true
    effect:
      category: check_advantage
      target: save_charisma
      target_scope: self
      bonus_type: circumstance
      value: 1
  - rule_id: rule_black_sun_species_human_synergy
    narrative: Humans blend easily into the Imperial circles Black Sun infests.
    llm_guidance: Apply when a Human Black Sun member makes an Insight check while
      operating within Imperial or mainstream contexts. Their unremarkable appearance
      aids infiltration.
    trigger_tags:
    - tag_faction_black_sun
    - tag_human
    trigger_event: on_check
    condition:
      logic: AND
      conditions:
      - type: tag
        target: tag_faction_black_sun
        operator: has
        value: true
      - type: tag
        target: tag_human
        operator: has
        value: true
    effect:
      category: skill_bonus
      target: skill_insight
      target_scope: self
      bonus_type: circumstance
      value: 1
  - rule_id: rule_black_sun_background_criminal_synergy
    narrative: A history of crime is the only resume Black Sun accepts.
    llm_guidance: Apply when a Black Sun member with a Criminal background makes a
      Streetwise check. Their prior experience in underworld dealings gives them an
      edge.
    trigger_tags:
    - tag_faction_black_sun
    - tag_background_criminal
    trigger_event: on_check
    condition:
      logic: AND
      conditions:
      - type: tag
        target: tag_faction_black_sun
        operator: has
        value: true
      - type: tag
        target: tag_background_criminal
        operator: has
        value: true
    effect:
      category: skill_bonus
      target: skill_streetwise
      target_scope: self
      bonus_type: circumstance
      value: 1
  - rule_id: rule_black_sun_background_noble_synergy
    narrative: Disgraced nobles find new power structures in the Vigo courts.
    llm_guidance: Apply when a Black Sun member with a Noble background makes a Persuasion
      check in high-society or political contexts. Their social training serves syndicate
      diplomacy.
    trigger_tags:
    - tag_faction_black_sun
    - tag_background_noble
    trigger_event: on_check
    condition:
      logic: AND
      conditions:
      - type: tag
        target: tag_faction_black_sun
        operator: has
        value: true
      - type: tag
        target: tag_background_noble
        operator: has
        value: true
    effect:
      category: skill_bonus
      target: skill_persuasion
      target_scope: self
      bonus_type: circumstance
      value: 1
