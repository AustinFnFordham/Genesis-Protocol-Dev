essence:
  overview: "Black Sun isn't a gang \u2014 it's a shadow court. Vigo salons on Coruscant\
    \ trade in favors like currency, and every favor has a witness. The Falleen nobility\
    \ keeps the syndicate polished on the surface and feral underneath: spice, slaves,\
    \ piracy, assassination \u2014 all managed with ledgers clean enough to pass through\
    \ a senator's hands.\n"
  ideology: "Profit is proof. Discretion is survival. Violence is a tool, not a personality\
    \ \u2014 and the Sun punishes waste. The only unforgivable sin is drawing heat\
    \ that can't be redirected.\n"
  style_guide:
    tone: Opulent Menace
    key_phrases:
    - The Sun sees receipts.
    - Keep it clean.
    - Pay the debt, or become it.
    image_prompt_base: 'Star Wars underworld noir, Coruscant night rain, Falleen aristocrats
      in sharp suits, neon-green accent lighting, guarded counting-room, hidden blasters,
      tense smiles.

      '
    image_prompt_modifiers:
    - holo-ledger glow
    - silk-and-armor fashion
    - security droids at velvet ropes
  gm_guidance:
    first_missions:
    - Recover a stolen Vigo ring before it opens a safehouse door.
    - Burn a debt-ledger copy held by an ISB-adjacent accountant.
    - Escort a Falleen 'diplomat' who is actually delivering blackmail.
    - Plant counterfeit customs seals to redirect heat onto a rival syndicate.
    - "Find who skimmed a percentage off a spice shipment\u2014quietly."
    - Retrieve a crate that 'doesn't exist' from a Coruscant impound bay.
    - Silence a witness who thinks they're protected by the Republic.
    - Broker peace between two crews before the Vigo loses face.
    hooks:
    - "A Vigo's favor is called in\u2014on you\u2014by someone you've never met."
    - "An assassin's contract exists with your name on it\u2026 signed by a dead man."
    - 'A senator''s aide offers immunity for one name: yours.'
    - A safehouse door opens for the wrong ring.
    - A rival syndicate starts using Black Sun pheromone markers as a false flag.
    - "A ship arrives with crew missing and cargo untouched\u2014like it was judged."
    rumors:
    - Xizor's old ledgers still circulate, and they name everyone.
    - Someone in the Vigos is feeding ISB 'clean' intelligence.
    - A new spice cut causes hallucinations of green fire in the mirrors.
    - A counting room on Coruscant has been recording conversations for years.
    - "The Sun has a 'black list'\u2014one name added means you vanish."
    - "A Vigo is buying Jedi artifacts, not for power\u2014 for leverage."
    conflicts:
    - 'Vigo politics: humiliation is deadlier than gunfire.'
    - 'Heat management: you''re rewarded for crimes no one can prove.'
    - False flags and infiltration by rival syndicates.
    - "Falleen nobility vs street crews\u2014control vs chaos."
    tells_by_rank:
      rank_1: "Carries messages, not money\u2014if they have credits, they're bait."
      rank_2: Has a safehouse phrase and a handler who never says their real name.
      rank_3: Speaks in numbers and schedules; violence happens off-screen, on-time.
      rank_4: Walks with escorts who don't look like escorts.
      rank_5: "Never negotiates twice\u2014if they return, it's to end something."
  culture:
    customs:
    - Oaths sworn on Mustafar Fortress.
    - 'Debts are recorded twice: once in a ledger, once in a living witness.'
    - "Vigo gatherings are ritualized\u2014gift, compliment, threat, then business."
    taboos:
    - Talking numbers outside a counting room.
    - Skimming from the top without the Vigo's cut.
    - Bleeding where cameras can see it.
    status_markers:
    - Signet rings containing micro-transmitters.
    - Tailored coats with hidden seams for credsticks.
    - "A perfume note\u2014Falleen pheromone trace."
  tone_levers:
    always_on:
    - sci_fi
    temperatures:
      action: 0.6
      drama: 0.6
      horror: 0.2
      thriller: 0.4
      adventure: 0.6
      comedy: 0.1
      western: 0.2
    subgenres:
    - underworld_noir
    - political_intrigue
    notes: "Use dread sparingly\u2014cursed artifacts, haunted vaults, aftermath\u2014\
      never constant. The tone is opulent menace, not horror. Let the horror come\
      \ from betrayal and consequence.\n"
