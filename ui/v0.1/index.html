<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DATASLATE // Genesis Protocol v0.1</title>
<style>
  :root{
    --bg:#07090c; --slate:#0d1218; --panel:#111923; --line:#1e2c3a;
    --txt:#c8d6e5; --dim:#5c7089; --accent:#4fc3f7; --amber:#ffb300;
    --red:#ef5350; --green:#66bb6a; --mono:'Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:14px;
    background-image:radial-gradient(ellipse at 30% -20%, #0e1622 0%, var(--bg) 60%);min-height:100vh}
  #app{max-width:1240px;margin:0 auto;padding:14px;display:grid;grid-template-columns:290px 1fr;gap:14px}
  header{grid-column:1/3;border:1px solid var(--line);background:var(--slate);padding:10px 16px;
    display:flex;align-items:center;gap:18px;border-radius:4px}
  header .sys{color:var(--accent);letter-spacing:2px;font-weight:bold}
  header .pool{display:flex;flex-direction:column;font-size:11px;color:var(--dim)}
  header .pool b{color:var(--txt);font-size:13px}
  header .spacer{flex:1}
  .gmtoggle{cursor:pointer;border:1px solid var(--line);padding:4px 10px;border-radius:3px;color:var(--dim)}
  .gmtoggle.on{color:var(--amber);border-color:var(--amber)}
  nav{border:1px solid var(--line);background:var(--slate);border-radius:4px;padding:8px;height:fit-content}
  nav h3{font-size:11px;color:var(--dim);letter-spacing:2px;padding:8px 8px 4px}
  .entcard{padding:8px 10px;border:1px solid transparent;border-left:3px solid var(--line);
    margin:3px 0;cursor:pointer;border-radius:2px;transition:all .12s}
  .entcard:hover{background:var(--panel)}
  .entcard.sel{border-color:var(--line);border-left-color:var(--accent);background:var(--panel)}
  .entcard .n{color:var(--txt)}
  .entcard .t{font-size:10px;color:var(--dim);letter-spacing:1px}
  .badge{font-size:9px;padding:1px 6px;border-radius:2px;letter-spacing:1px;vertical-align:middle}
  .badge.gold{background:#3a2f00;color:#ffd54f;border:1px solid #6b5900}
  .badge.wip{background:#332000;color:var(--amber);border:1px solid #6b4500}
  main{border:1px solid var(--line);background:var(--slate);border-radius:4px;min-height:640px;position:relative;overflow:hidden}
  .slatebar{height:5px;background:var(--accent)}
  .wipglitch{position:absolute;top:5px;left:0;right:0;padding:3px 14px;font-size:10px;letter-spacing:2px;
    color:var(--amber);background:repeating-linear-gradient(45deg,#1a1200 0 8px,#0d0900 8px 16px);opacity:.9}
  .inner{padding:22px 26px}
  .ehead{display:flex;align-items:baseline;gap:14px;margin-bottom:2px;flex-wrap:wrap}
  .ehead h1{font-size:22px;letter-spacing:1px}
  .urid{color:var(--dim);font-size:11px}
  .tagrail{margin:10px 0 4px;display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:10px;color:var(--accent);border:1px solid var(--line);padding:2px 8px;border-radius:10px;cursor:default}
  .tag.broken{color:var(--red);border-color:var(--red)}
  .tabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--line)}
  .tab{padding:6px 16px;cursor:pointer;color:var(--dim);font-size:12px;letter-spacing:1px;border:1px solid transparent;border-bottom:none}
  .tab.on{color:var(--accent);border-color:var(--line);background:var(--panel);border-radius:3px 3px 0 0}
  .tabbody{background:var(--panel);border:1px solid var(--line);border-top:none;padding:18px;min-height:340px;
    border-radius:0 0 4px 4px;line-height:1.65}
  .statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
  .stat{border:1px solid var(--line);text-align:center;padding:8px 4px;border-radius:3px;background:var(--slate)}
  .stat .k{font-size:10px;color:var(--dim);letter-spacing:1px}
  .stat .v{font-size:20px;color:var(--txt)}
  .stat .m{font-size:11px;color:var(--accent)}
  .card{border:1px solid var(--line);border-radius:3px;padding:10px 14px;margin:8px 0;background:var(--slate)}
  .card h4{color:var(--accent);font-size:13px;margin-bottom:4px}
  .cond{color:var(--amber);font-size:11px}
  .lockico{color:var(--amber)}
  .dim{color:var(--dim)} .sm{font-size:11px}
  .chip{display:inline-block;border:1px solid var(--line);color:var(--accent);padding:2px 10px;margin:2px;
    border-radius:3px;cursor:pointer;font-size:12px}
  .chip.broken{color:var(--red);border-color:var(--red);cursor:default}
  .gmonly{border-left:3px solid var(--amber);padding-left:10px;margin:10px 0}
  .gmonly .lbl{color:var(--amber);font-size:10px;letter-spacing:2px}
  pre{white-space:pre-wrap;font-size:12px;color:var(--dim)}
  .gauge{height:6px;background:#0a0f14;border:1px solid var(--line);border-radius:3px;overflow:hidden;width:90px}
  .gauge i{display:block;height:100%;background:var(--accent)}
  .footlog{grid-column:1/3;border:1px solid var(--line);background:var(--slate);border-radius:4px;
    padding:8px 14px;font-size:11px;color:var(--dim);max-height:110px;overflow-y:auto}
  .footlog .ok{color:var(--green)} .footlog .warn{color:var(--amber)}
  h3.sec{color:var(--dim);font-size:11px;letter-spacing:2px;margin:14px 0 6px}
  table{border-collapse:collapse;width:100%;font-size:12px}
  td,th{border:1px solid var(--line);padding:5px 9px;text-align:left}
  th{color:var(--dim);font-size:10px;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"><span class="sys">GENESIS//OS</span><span class="dim sm">loading campaign state…</span></header>
  <nav id="sidebar"><h3>REGISTRY MANIFEST</h3></nav>
  <main id="slate"><div class="slatebar"></div><div class="inner"><span class="dim">select an entry from the manifest…</span></div></main>
  <div class="footlog" id="log"></div>
</div>
<script>
/* ============================================================
   Genesis UI v0.1 — production-shaped logic, minimal styling.
   Contract: components bind to schema paths via accessors;
   all cross-entity refs resolve through an O(1) registry Map.
   State changes flow through dispatch() applying RFC6902 ops —
   the same patch format the forge emits.
   ============================================================ */
const S = { registry: new Map(), manifest: [], campaign: null, sel: null, tab: 0, gm: false };

/* ---------- accessors: tolerate legacy + core schema shapes ---------- */
const getId   = e => e?.metadata?.id ?? e?.id ?? 'unknown';
const getName = e => e?.metadata?.name ?? e?.name ?? getId(e);
const getTags = e => e?.taxonomy?.tags ?? e?.narrative_tags ?? e?.tags
  ?? e?._legacy?.taxonomy?.tags ?? e?._legacy?.tags ?? [];   // mid-migration fallbacks
const getEra  = e => [].concat(e?.taxonomy?.era ?? e?.era ?? []).join(' · ');
const getHex  = e => e?.ui?.color_hex ?? '#4fc3f7';
const getStatus = (urid) => (S.manifest.find(m=>m.urid===urid)?.tier ?? 'wip');

/* ---------- O(1) registry resolution; broken refs render visibly ---------- */
function refChip(urid){
  const known = S.registry.has(urid);
  return `<span class="chip ${known?'':'broken'}" ${known?`onclick="select('${urid}')"`:''}>${known?'':'⛓ '} ${urid}</span>`;
}

/* ---------- RFC6902 dispatch (subset: replace) ---------- */
function dispatch(ops){
  for(const op of ops){
    const seg = op.path.split('/').filter(Boolean);
    let tgt = S.campaign;
    for(let i=0;i<seg.length-1;i++) tgt = tgt[isNaN(+seg[i])?seg[i]:+seg[i]];
    if(op.op==='replace') tgt[seg.at(-1)] = op.value;
    log(`PATCH ${op.op} ${op.path} → ${JSON.stringify(op.value)}`,'ok');
  }
  renderTop();
}

function log(msg, cls){
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls||''}">[${new Date().toISOString().slice(11,19)}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

/* ---------- top bar: CampaignState bindings ---------- */
function renderTop(){
  const c = S.campaign, p = c.party[0];
  document.getElementById('topbar').innerHTML = `
    <span class="sys">GENESIS//OS</span>
    <span class="pool"><span>CAMPAIGN</span><b>${c.name}</b></span>
    <span class="pool"><span>OPERATIVE</span><b>${p.name} · L${p.level}</b></span>
    <span class="pool"><span>HP ${p.hp.current}/${p.hp.max}</span><span class="gauge"><i style="width:${100*p.hp.current/p.hp.max}%"></i></span></span>
    <span class="pool"><span>OBLIGATION ${p.ffg_pools.obligation}</span><span class="gauge"><i style="width:${p.ffg_pools.obligation}%;background:var(--amber)"></i></span></span>
    <span class="pool"><span>MORALITY ${p.ffg_pools.morality}</span><span class="gauge"><i style="width:${p.ffg_pools.morality}%;background:var(--green)"></i></span></span>
    <span class="pool"><span>LOCATION</span><b>${refChipInline(c.current_location_id)}</b></span>
    <span class="spacer"></span>
    <span class="gmtoggle ${S.gm?'on':''}" onclick="S.gm=!S.gm;renderTop();render()">${S.gm?'GM VIEW':'PLAYER VIEW'}</span>`;
}
const refChipInline = urid => S.registry.has(urid)
  ? `<a style="color:var(--accent);cursor:pointer" onclick="select('${urid}')">${getName(S.registry.get(urid))}</a>`
  : `<span style="color:var(--red)">${urid}?</span>`;

/* ---------- sidebar manifest ---------- */
function renderSide(){
  const nav = document.getElementById('sidebar');
  nav.innerHTML = '<h3>REGISTRY MANIFEST</h3>' + S.manifest.map(m=>`
    <div class="entcard ${S.sel===m.urid?'sel':''}" onclick="select('${m.urid}')">
      <div class="n">${getName(S.registry.get(m.urid))} <span class="badge ${m.tier}">${m.tier.toUpperCase()}</span></div>
      <div class="t">${m.entity_type.toUpperCase()} · ${m.urid}</div>
    </div>`).join('');
}

function select(urid){ S.sel=urid; S.tab=0; renderSide(); render(); log(`LOAD ${urid} (chain depth 1, ${getStatus(urid)})`); }
function setTab(i){ S.tab=i; render(); }

/* ---------- entity renderers ---------- */
const mod = v => { const m = Math.floor((v-10)/2); return (m>=0?'+':'')+m; };
const esc = s => String(s??'').replace(/</g,'&lt;');

function statGrid(stats){
  if(!stats) return '';
  const keys=['str','dex','con','int','wis','cha'];
  const get=k=>stats[k] ?? stats[k.toUpperCase()] ?? stats?.abilities?.[k] ?? stats?.ability_scores?.[k];
  const cells=keys.map(k=>{const v=get(k); return v==null?'':`<div class="stat"><div class="k">${k.toUpperCase()}</div><div class="v">${v}</div><div class="m">${mod(v)}</div></div>`}).join('');
  return cells?`<div class="statgrid">${cells}</div>`:'';
}

function gmBlock(title, body){
  if(!body) return '';
  if(!S.gm) return `<div class="gmonly"><span class="lbl">■ ${title} — GM EYES ONLY (toggle GM VIEW)</span></div>`;
  return `<div class="gmonly"><span class="lbl">■ ${title}</span><pre>${esc(typeof body==='string'?body:JSON.stringify(body,null,1))}</pre></div>`;
}

const RENDER = {
  faction(e){
    return tabs(e, [
      ['INTEL', `<p>${esc(e.essence?.overview)}</p><h3 class="sec">IDEOLOGY</h3><p>${esc(e.essence?.ideology)}</p>`
        + gmBlock('GM GUIDANCE', e.essence?.gm_guidance)],
      ['STRUCTURE', `<h3 class="sec">RANK LADDER</h3>` + (e.structure?.ranks??[]).map(r=>`<div class="card"><h4>${esc(r.name??r)}</h4><span class="sm dim">${esc(r.description??'')}</span></div>`).join('')],
      ['NETWORK', `<h3 class="sec">HEADQUARTERS</h3>${refChip(e.connections?.headquarters_id)}
        <h3 class="sec">KEY PERSONNEL</h3>${(e.connections?.key_npc_ids??[]).map(refChip).join('')||'<span class="dim sm">no records</span>'}
        <h3 class="sec">ALLIES</h3>${(e.connections?.allies??[]).map(refChip).join('')||'<span class="dim sm">none</span>'}
        <h3 class="sec">ENEMIES</h3>${(e.connections?.enemies??[]).map(refChip).join('')||'<span class="dim sm">none</span>'}
        <h3 class="sec">NEUTRAL / WATCHLIST</h3>${(e.connections?.neutral??[]).map(refChip).join('')||'<span class="dim sm">none</span>'}`],
      ['CHAOS PROTOCOLS', (e.synergy_engine?.rules??[]).map(r=>`<div class="card"><h4>${esc(r.id??'rule')}</h4><span class="sm">${esc(r.description??'')}</span>${gmBlock('LLM GUIDANCE', r.llm_guidance)}</div>`).join('')||'<span class="dim sm">no chaos rules hosted</span>'],
    ]);
  },
  creature(e){
    return tabs(e, [
      ['STATBLOCK', statGrid(e.stats) + `<h3 class="sec">ATTACKS</h3>` + (e.attacks??[]).map(a=>`
        <div class="card"><h4>${esc(a.name)} ${a.condition?`<span class="lockico" title="${esc(a.condition)}">🔒</span>`:''}</h4>
        <span class="sm">${esc(a.damage??a.description??'')}</span>
        ${a.condition?`<div class="cond">requires: ${esc(a.condition)}</div>`:''}
        ${a.effect?`<div class="sm dim">${esc(a.effect)}</div>`:''}</div>`).join('')],
      ['DOSSIER', `<p>${esc(e.narrative)}</p><h3 class="sec">FIELD RUMOR</h3><p class="dim">"${esc(e.flavor_text??'')}"</p>
        <h3 class="sec">ORIGIN</h3><p class="sm">${esc(e.origin_story??'')}</p>`],
      ['BEHAVIOR', gmBlock('AI BEHAVIOR', e.ai_behavior) + gmBlock('LLM GUIDANCE', e.llm_guidance)],
      ['HOOKS', (e.connections?.hooks??e.connections?.narrative_hooks??[]).map(h=>`<div class="card"><span class="sm">${esc(h.description??h)}</span></div>`).join('')||'<span class="dim sm">none</span>'],
    ]);
  },
  species(e){
    const L = e._legacy ?? {};   // mid-migration: legacy roots quarantined, still renderable
    const traits = e.traits ?? L.traits ?? L.species_traits ?? L.racial_traits ?? L.special_traits ?? L.features ?? [];
    return tabs(e, [
      ['TRAITS', statGrid(L.ability_score_increases??e.stats??L.stats) + [].concat(traits).map(t=>`<div class="card"><h4>${esc(t.name??t.id??t)}</h4><span class="sm">${esc(t.description??t.summary??'')}</span></div>`).join('')],
      ['CULTURE', `<pre>${esc(JSON.stringify(L.cultural_matrix??L.culture??L.cultural_features??e.culture??{},null,1).slice(0,5000))}</pre>`],
      ['RAW', `<pre>${esc(JSON.stringify(e,null,1).slice(0,6000))}</pre>`],
    ]);
  },
  class(e){
    const feats = e.features ?? e.class_features ?? e.levels ?? [];
    return tabs(e, [
      ['PROGRESSION', `<table><tr><th>LVL</th><th>FEATURE</th><th>DETAIL</th></tr>` +
        [].concat(feats).slice(0,40).map(f=>`<tr><td>${esc(f.level??'')}</td><td>${esc(f.name??f.id??'')}</td><td class="sm dim">${esc((f.description??'').slice(0,140))}</td></tr>`).join('')+`</table>`],
      ['CORE', `<pre>${esc(JSON.stringify({hit_die:e.hit_die,primary_ability:e.primary_ability,saves:e.saving_throws},null,1))}</pre>`],
      ['RAW', `<pre>${esc(JSON.stringify(e,null,1).slice(0,6000))}</pre>`],
    ]);
  },
  subclass(e){ return RENDER.class(e); },
  location(e){
    return tabs(e, [
      ['OVERVIEW', `<p>${esc(e.description??e.essence?.overview??'')}</p>
        <h3 class="sec">PLANET</h3>${refChip(e.planet??e.connections?.planet_id??'')}
        <h3 class="sec">POINTS OF INTEREST</h3>${(e.points_of_interest??[]).map(p=>`<div class="card"><span class="sm">${esc(p)}</span></div>`).join('')||'<span class="dim sm">none catalogued</span>'}`],
      ['RAW', `<pre>${esc(JSON.stringify(e,null,1).slice(0,6000))}</pre>`],
    ]);
  },
};

function tabs(e, defs){
  const head = defs.map((d,i)=>`<span class="tab ${S.tab===i?'on':''}" onclick="setTab(${i})">${d[0]}</span>`).join('');
  return `<div class="tabs">${head}</div><div class="tabbody">${defs[S.tab]?.[1]??''}</div>`;
}

function render(){
  const m = document.getElementById('slate');
  if(!S.sel){ return; }
  const e = S.registry.get(S.sel);
  const mtype = S.manifest.find(x=>x.urid===S.sel)?.entity_type ?? 'faction';
  const tier = getStatus(S.sel);
  m.innerHTML = `<div class="slatebar" style="background:${getHex(e)}"></div>
    ${tier!=='gold'?'<div class="wipglitch">⚠ UNVERIFIED DATA — ENTITY HAS NOT CLEARED GOLD GATE ⚠</div>':''}
    <div class="inner" style="padding-top:${tier!=='gold'?'34px':'22px'}">
      <div class="ehead"><h1>${getName(e)}</h1><span class="badge ${tier}">${tier.toUpperCase()}</span><span class="urid">${getId(e)} · ${getEra(e)}</span></div>
      <div class="tagrail">${getTags(e).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${(RENDER[mtype]??RENDER.faction)(e)}
    </div>`;
}

/* ---------- boot ---------- */
fetch('campaign_data.json').then(r=>r.json()).then(d=>{
  d.manifest.forEach(m=>S.registry.set(m.urid, d.registry[m.urid]));
  S.manifest = d.manifest; S.campaign = d.campaign_state;
  renderTop(); renderSide();
  log(`REGISTRY ONLINE — ${S.manifest.length} entities (${S.manifest.filter(m=>m.tier==='gold').length} gold)`, 'ok');
  log(`pipeline: ${d.pipeline}`);
  select(S.campaign.faction_watch?.[0] ?? S.manifest[0].urid);
  /* QA hook: simulate a forge state delta after 6s — HP drop via RFC6902 */
  setTimeout(()=>dispatch([{op:'replace',path:'/party/0/hp/current',value:38}]), 6000);
}).catch(e=>log('BOOT FAILURE: '+e.message,'warn'));
</script>
</body>
</html>
