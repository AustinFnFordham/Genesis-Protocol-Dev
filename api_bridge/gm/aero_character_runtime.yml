document:
  id: character_runtime_aeleron_doordo_level_1
  type: genesis_character_runtime
  version: 1
  visibility: player_and_gm
  status: ready_for_play
  campaign_phase: design
  narration_started: false

character_runtime:
  identity:
    name: "Aeleron \"Aero\" Do'ordo"
    species: Echani
    background: Jedi
    current_rank: Newly Knighted Jedi
    class: Sentinel
    subclass_plan: Sentry
    level: 1
    age: 20
    dominant_hand: right
    preferred_blaster_hand: left

  abilities:
    scores: {strength: 8, dexterity: 16, constitution: 12, intelligence: 12, wisdom: 14, charisma: 14}
    modifiers: {strength: -1, dexterity: 3, constitution: 1, intelligence: 1, wisdom: 2, charisma: 2}
    proficiency_bonus: 2

  defenses:
    maximum_hp: 11
    current_hp: 11
    hp_formula: Echani base HP 10 + Constitution modifier 1
    maximum_strain: 12
    current_strain: 12
    strain_formula: Echani base Strain 11 + Constitution modifier 1
    armor_class: 13
    armor_class_formula: 10 + Dexterity modifier 3
    saving_throws: {strength: -1, dexterity: 5, constitution: 1, intelligence: 1, wisdom: 2, charisma: 4}
    saving_throw_proficiencies: [dexterity, charisma]
    conditions: []

  resources:
    maximum_force_points: 3
    current_force_points: 3
    force_point_formula: Level 1 + Charisma modifier 2
    force_point_recovery:
      long_rest: restore all
      meditation_kit: once per long rest during a short rest, restore up to 2 spent Force Points
    sentinel_balance: {maximum_uses: 2, current_uses: 2, recovery: long_rest}
    combat_communication: {maximum_sparring_uses: 1, current_sparring_uses: 1, recovery: short_rest}

  movement:
    speed: 30 feet
    initiative: 3

  senses:
    passive_perception: 14
    passive_insight: 14
    passive_investigation: 11
    other_senses: []

  proficiencies:
    skills:
      insight: {modifier: 4, source: Jedi background}
      persuasion: {modifier: 4, source: Jedi background}
      technology: {modifier: 3, source: Sentinel}
      intimidation: {modifier: 4, source: Sentinel}
      perception: {modifier: 4, source: Sentinel}
    tools: [Security Kit]
    armor: [Light armor]
    weapons: [Simple weapons, Lightsabers, Blaster pistols, Unarmed strikes]
    languages: [Galactic Basic, Echani, Sith]

  forcecasting:
    ability: charisma
    attack_modifier: 4
    save_dc: 12
    powers_known: 2
    highest_power_level: 0
    concentration:
      save: Constitution
      modifier: 1
      dc: 10 or half the triggering damage, whichever is higher
      failure: concentration ends
      automatic_end:
        - Aero becomes incapacitated
        - Aero begins another concentration effect

  features:
    - name: Martial Arts Training
      source: 06-lore-species.zip/official_species_playable/echani.yml
      action_type: passive
      exact_effect: Proficient with unarmed strikes; may use Dexterity for their attack and damage rolls.
      limitations:
        - Does not grant lightsaber properties.
        - The adopted unarmed damage die is 1d4.

    - name: Combat Discipline
      source: 06-lore-species.zip/official_species_playable/echani.yml
      action_type: passive
      exact_effect: Advantage on Wisdom (Insight) checks when analyzing combat situations or opponents.
      information_boundary: May reveal apparent stance, focus, readiness, fighting approach, or immediate tactical intent; never thoughts, statistics, alignment, or objective truth.

    - name: Combat Communication
      source: 06-lore-species.zip/official_species_playable/echani.yml
      action_type: passive or free action
      exact_effect:
        - Advantage on Insight checks to read emotions during combat.
        - Once per short rest, after a meaningful brief sparring match, advantage on one Charisma check.
      limitations: No blanket Persuasion advantage and no compulsion or mind reading.

    - name: Force Connection
      source: 04-game_data.zip/classes/sentinel.yml; adopted implementation
      action_type: passive or action
      range: 30 feet for focused reading
      exact_effect:
        passive: May sense significant Force disturbances without automatically learning identity, location, or explanation.
        focused: As an action, focus on one visible creature within 30 feet and gain advantage on one Insight check before the end of Aero's next turn to read emotional state or apparent concealment.
      limitations: Cannot read thoughts, memories, statistics, alignment, or objective truth; Force shielding may block it.

    - name: Sentinel Balance
      source: 04-game_data.zip/classes/sentinel.yml; adopted implementation
      action_type: reaction
      trigger: After failing a Dexterity or Charisma save but before consequences resolve.
      cost: one use
      exact_effect: Add 1d4 to the failed saving throw, potentially turning it into a success.
      limitations: Two uses per long rest; cannot affect attacks, checks, damage, AC, or successful saves.

    - name: Lightsaber Deflect - Tier 1
      source: adopted Level 1 technique
      action_type: reaction
      trigger: Hit by a perceptible ranged energy attack while wielding an active lightsaber and not incapacitated.
      exact_effect: Reduce damage by 1d10+2. If reduced to zero, Aero may make a +5 ranged deflection attack against one visible creature within 30 feet; on a hit it deals the original attack's rolled damage without adding Dexterity.
      limitations: Cannot affect area attacks, explosions, environmental damage, melee attacks, or attacks declared non-deflectable; normally once per round.

    - name: Former Master and Jedi Network
      source: 04-game_data.zip/backgrounds/background_jedi.yml; rank-adapted presentation
      action_type: narrative or social
      exact_effect: Knows Master Taron's last confirmed region and how to identify or locate established Jedi safe houses and trusted contacts. Reasonably available contacts may offer guidance, basic information, or temporary shelter.
      limitations: Does not guarantee supplies, credits, transport, obedience, or safety; specific contacts and safe houses are established only through sourced play.

    - name: Echani Grappling Training
      source: 04-game_data.zip/actions/combat_actions.yml; adopted Dexterity implementation
      action_type: special melee attack
      range: 5 feet
      exact_effect: With a free hand, make a Dexterity-based martial check at +5 against the target's Strength (Athletics) or Dexterity (Acrobatics). On success, the target is grappled and its speed becomes 0.
      limitations:
        - Target may be no more than one size larger.
        - Deals no damage and grants no attack advantage by itself.
        - Drag at half speed; target may use its action for a contested escape; release freely.
        - Shove or Takedown requires a separate attack and contest.
        - Pushing the target away normally ends the grapple.

  powers:
    - name: Battle Insight
      level: 0
      alignment: Universal
      action_type: action
      cost: 0 Force Points
      range: 30 feet
      duration: concentration, up to 1 minute
      concentration: true
      exact_effect: Choose one visible creature. Aero has advantage on his next attack against it. The effect ends after that attack, if concentration breaks, if the target becomes invalid, or after 1 minute.
      legal_at_level_1: true
      source: 04-game_data.zip/powers/power_battle_insight.yml
      rules_status: Confirmed effect with adopted duration override; source duration is 1 round.

    - name: Burst
      level: 0
      alignment: Universal
      action_type: action
      cost: 0 Force Points
      range: 5-foot radius centered on Aero
      duration: instantaneous
      concentration: false
      exact_effect: Every other creature in the radius, including allies, makes a Dexterity save against DC 12. Failure deals 1d4 force damage and knocks the creature prone; success causes neither. Aero is unaffected.
      legal_at_level_1: true
      source: 04-game_data.zip/powers/power_burst.yml
      rules_status: Level, cost, radius, and damage confirmed; save, self-exclusion, success result, and prone rider are adopted table rulings.

  equipment:
    armor:
      name: Dark-grey Jedi robes with Master Taron's Mornos Synthweave mantle
      equipped: true
      armor_category: unarmored clothing
      armor_formula: 10 + Dexterity modifier
      dexterity_rules: full Dexterity modifier
      penalties: none
      resulting_ac: 13
      exact_effects:
        - Advantage on qualifying diplomacy checks when recognized Jedi status materially assists.
        - The mantle repairs ordinary minor cuts, scorch marks, and wear during a short rest.
        - The mantle grants no AC bonus.
      source: 04-game_data.zip/items/armor_modular.yml; Chronicle continuity; adopted AC and mantle implementation

    weapons:
      - name: Taron-forged Modular Indigo Lightsaber
        equipped: true
        carry: left hip for right-hand draw
        attack_ability: Dexterity
        attack_bonus: 5
        damage: {one_handed: 1d8+3, two_handed: 1d10+3}
        damage_type: energy
        range: 5 feet
        properties: [finesse, versatile, Force weapon, deflect-capable]
        current_configuration:
          - One mechanically functional assembled lightsaber.
          - Splitting the hilt provides no current combat benefit.
          - Blue and violet crystals harmonize into one indigo blade.
        design:
          length: 12.5-inch modular split-line hilt
          emitters: recessed twin-crown architecture
          materials: brushed pale-silver durasteel, charcoal tactile panels, gunmetal coupling
          controls: recessed mirrored thumb-slides
          hidden_inscriptions: {blue_half: LISTEN, violet_half: ANSWER}
          craft_history: Taron personally forged the chassis and focusing architecture; Aero bonded with the crystals and participated in sacred assembly.
        source: 04-game_data.zip/items/weapons.yml; adopted repair and custom design

      - name: Standard Blaster Pistol
        equipped: true
        carry: right hip for left-hand draw
        attack_ability: Dexterity
        attack_bonus: 5
        damage: 1d6+3
        damage_type: energy
        range: {normal: 40 feet, long: 160 feet}
        long_range_rule: disadvantage beyond 40 feet
        properties: [one-handed, ammunition, reload]
        capacity: 12
        reload: action
        ammunition_total: 50
        kyber_attunement: none
        design: Compact dark-gunmetal Republic service pistol with brushed-silver controls and a left-hand-shaped grip.
        source: 04-game_data.zip/items/weapons_expanded.yml; adopted repaired combat profile

      - name: Unarmed Strike
        equipped: always available
        attack_ability: Dexterity
        attack_bonus: 5
        damage: 1d4+3
        damage_type: kinetic
        range: 5 feet
        special_rules: May use fists, feet, elbows, knees, or similar strikes; does not require an empty hand; does not trigger lightsaber-only effects.
        source: 06-lore-species.zip/official_species_playable/echani.yml; adopted 1d4 die

    inventory:
      - {item: Security Kit, quantity: 1, exact_effect: 'Enables physical-security Technology checks at +3; no blanket advantage and no double proficiency.'}
      - {item: Meditation Kit, quantity: 1, exact_effect: 'Once per long rest during an uninterrupted short rest, restore up to 2 spent Force Points.'}
      - {item: Backpack, quantity: 1, exact_effect: mundane storage}
      - {item: Bedroll, quantity: 1, exact_effect: mundane sleeping equipment}
      - {item: Compact mess kit, quantity: 1, exact_effect: mundane eating and cooking equipment}
      - {item: Ration pack, quantity: 10, exact_effect: one ordinary field ration each}
      - {item: Canteen, quantity: 1, exact_effect: mundane water container}
      - {item: Compact Jedi glowrod, quantity: 1, exact_effect: adjustable cool-white illumination with magnetic belt clip; no automatic combat benefit}
      - {item: Syntherope, quantity: 1, exact_effect: 50 feet of mundane utility rope}
      - {item: Basic fire-starting tool, quantity: 1, exact_effect: ordinary fire-starting where conditions permit}
      - {item: Personal comlink, quantity: 1, exact_effect: ordinary communications where networks permit}
      - {item: Blaster ammunition, quantity: 50, exact_effect: 50 total shots; pistol capacity 12}
    credits: 50

  background:
    feature: Former Master and Jedi Network
    former_master:
      name: Vael Taron
      species: Cathar
      former_title: Shadow Master Taron
      final_known_office: Weapons Master of the Coruscant Jedi Temple
      status: missing
      objective_fate: unresolved
      last_known_region: Meridian Reach
    safe_houses: {known_access: true, specific_locations: []}
    stillwater_incident:
      location: Meridian Archive Annex Aurek-7, locally called Stillwater Annex
      mission_role: Aero's final mission as a Padawan and first field command
      official_objective: Investigate a reactivated remote archive annex containing Long Silence journals tentatively associated with the earlier celestial phenomenon.
      memory_boundary: Aero remembers arriving and beginning the investigation. His memories become trauma-fragmented after accessing a sealed archive section. His final reliable memory is Taron ordering him back to the ship; his next continuous memory is approaching Coruscant alone.
      memory_cause: psychological trauma; no confirmed mystical suppression
      council_ruling: [mission unresolved, Taron missing, Aero cleared of misconduct, records temporarily sealed, knighthood legitimate]
      field_restriction: four moons of meditation and recovery, completed
      current_belief: Aero believes some Council members consider him incompetent, naive, or unprepared because of his age and condition after Stillwater.

  soul:
    voice: Clear controlled tenor; precise rather than monotone; warmer, quicker, and openly amused with trusted people.
    observation_mannerism: Becomes still and follows a person's eyes, face, shoulders, hands, hips, and knees as if watching a dance. Subtle head movement signifies engagement, particularly to another Echani.
    regional_values: [Listen before commanding, Help before being asked, Keep a steady hand]

  crafting_seeds:
    active_mechanical_benefit: none
    future_split_saber:
      status: design target only
      joined: approximately 4-4.5-foot indigo Convergence blade; provisional 1d12+DEX and two-handed
      separated: paired approximately 3-foot blue and violet blades; provisional 1d8+DEX each
      requirements: future materials, completed independent systems, crafting, legal training, and audit
    future_kyber_sidearm:
      status: concept only
      concept: attuned kyber-resonance precision pistol emphasizing Force-guided accuracy
    future_saber_marksman_platform:
      status: late-game concept only
      concept: long-range blaster platform using Aero's docked saber as focusing core
      limitation: saber unavailable while docked; mechanics undefined until earned

  validation:
    confirmed:
      - Sentinel proficiencies and Level 1 feature names
      - Echani speed, base HP, base Strain, languages, and trait text
      - Jedi background skills, language choice, and network feature
      - Two legal Level 0 powers selected from the complete Level 1 list
      - Grapple and Shove are universal combat actions
    provisional:
      - PB, HP, Strain, AC, and Force Point formulas where files omit progression
      - repaired weapon profiles and starting package
      - Force Connection, Sentinel Balance, Deflect, kit, grapple, and robe implementations
      - Battle Insight duration override and Burst save/prone implementation
      - dual-crystal resonance, mantle repair, and future crafting seeds
    unresolved:
      - authoritative Sentinel equipment and Force Point progressions
      - canonical generic Jedi-robe AC and complete concentration rules
      - named safe houses and contacts
      - Taron's objective fate, location, and Stillwater truth
      - future crafting mechanics and unlock levels
    illegal_or_conflicting_choices:
      - Force Technique and Saber Ward were replaced because the Level 1 list did not permit them.
      - Sentinel equipment is a declared repair because its source block is absent.
      - Jedi robe records conflict; adopted unarmored AC is used.

